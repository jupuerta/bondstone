name: CI

# Technical_Design_V1 §9: every push runs build + test, so a break is caught before
# it reaches production. Since phase 4.9 of the deployment plan, a tag also publishes
# the production image to GHCR — the server pulls, it never compiles.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # The integration tests spin up Postgres through Testcontainers, which needs the
    # Docker daemon the ubuntu runners already provide.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore

      - run: dotnet build --no-restore --configuration Release

      - run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - run: dotnet restore

      # `dotnet list package --vulnerable` exits 0 whether it finds anything or not, so the
      # grep is what turns it into a gate.
      #
      # The gate covers the Api project's transitive closure, which is exactly what the
      # Dockerfile publishes: Api → Infrastructure → Application → Domain. Test projects are
      # audited too, in the step below, but they do not fail the build — nothing they reference
      # is ever served to anybody, and wedging a deploy over the test harness would mean the
      # next urgent fix waits on a dependency migration.
      - name: Audit what ships
        run: |
          out=$(dotnet list src/arch-forge-backend.Api/arch-forge-backend.Api.csproj package --vulnerable --include-transitive)
          echo "$out"
          if echo "$out" | grep -q "has the following vulnerable packages"; then
            echo "::error::A package that ships in the production image has a known advisory."
            exit 1
          fi

      # Known and accepted as of 2026-09-25: Testcontainers.PostgreSql 3.10.0 pulls
      # SSH.NET 2023.0.0, which carries two High advisories. There is no 3.x patch — the fix is
      # the 4.x jump, and that is a migration of the integration harness, not a version bump.
      - name: Audit everything else (informative)
        continue-on-error: true
        run: dotnet list package --vulnerable --include-transitive

  docker-image:
    # Builds on every push, which is what proves the production Dockerfile still works. On a
    # tag it also publishes: that image is what the server pulls, so it never needs the source.
    runs-on: ubuntu-latest
    needs: [build-and-test, audit]

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bondstone-api
          tags: |
            type=ref,event=tag
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/arch-forge-backend.Api/Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

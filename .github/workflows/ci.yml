name: ci

# `master` is this repo's real branch. Since phase 4.9 of the deployment plan a tag also
# publishes the production image to GHCR — the server pulls, it never compiles.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Only what ships gates the build. Everything in devDependencies — vite, vitest,
      # playwright — builds the site and never reaches a browser, so an advisory there is worth
      # knowing and not worth blocking a deploy over.
      - name: Audit what ships
        run: npm audit --omit=dev --audit-level=high

      - name: Audit everything else (informative)
        continue-on-error: true
        run: npm audit --audit-level=high

  docker-image:
    # New in phase 4.9, and it closes a real gap: until now neither the production Dockerfile nor
    # nginx.conf were built anywhere, so a typo in the CSP or in the token-scrubbing `map` would
    # have surfaced on the server. Now every push builds it; a tag also publishes it.
    runs-on: ubuntu-latest
    needs: check

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bondstone-frontend
          tags: |
            type=ref,event=tag
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Vite bakes these in at build time; there is no way to set them on a running
          # container. The demo tokens are read-only `shareToken`s that end up in the bundle
          # anyway, so they are repository *variables*, not secrets — and while they are unset
          # the homepage shows its "not configured" panel instead of the demo.
          build-args: |
            VITE_API_URL=/api
            VITE_DEMO_BEFORE_TOKEN=${{ vars.VITE_DEMO_BEFORE_TOKEN }}
            VITE_DEMO_AFTER_TOKEN=${{ vars.VITE_DEMO_AFTER_TOKEN }}
            VITE_DEMO_FAULT_NODE=${{ vars.VITE_DEMO_FAULT_NODE || 'Postgres' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

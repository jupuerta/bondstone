# El frente único de Bondstone: sirve la web y el editor, y proxya la API. El editor antiguo ya no
# está detrás de ninguna ruta (docs/Design/Editor/01_decisiones_de_partida.md, decisión 13.3).
#
# Este fichero se copia a /etc/nginx/conf.d/default.conf, es decir, dentro del bloque `http`: por
# eso `map`, `log_format` y `access_log` pueden vivir aquí arriba.

# El esquema real de la petición, no el de esta capa. En producción la cadena es
# `navegador → Caddy → nginx → api`, y el `$scheme` de este nginx es siempre `http` porque escucha
# en el 80 detrás de Caddy. Reenviar `$scheme` tal cual le diría a la API «esto vino por HTTP» en
# todas las peticiones, y con `Security__RequireHttps=true` eso es un bucle de redirecciones
# infinito el día que se encienda el certificado.
#
# El respaldo `""  $scheme` es para cuando no hay nadie delante — la pila local en
# `http://localhost:8080`, donde nadie pone la cabecera y el esquema de aquí sí es el verdadero.
#
# Que esto sea seguro depende de que Caddy **pise** el `X-Forwarded-Proto` que traiga el cliente en
# lugar de reenviarlo, que es lo que hace su `reverse_proxy` por omisión. En la pila local el
# frontend sí está publicado y un cliente puede mentir aquí, pero allí `RequireHttps` es `false` y
# la mentira no sirve de nada.
map $http_x_forwarded_proto $proto_real {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Los tokens de edición **son** la autenticación de este producto y viajan en la ruta, así que el
# registro de accesos normal los graba en claro: en la línea de petición de `/e/<token>` y, peor,
# en el `Referer` de cada recurso que cargue esa página. Cualquiera con acceso a los logs podría
# editar el trabajo de cualquiera, y la página de privacidad promete que ese registro solo sirve
# para mantener el servicio.
#
# Aquí se tapan las dos mitades: la ruta se sustituye por `<token>` literal, y el `Referer`
# desaparece del formato entero.
#
# **No basta con `/a/` y `/e/`.** Esas son las direcciones que se ven en la barra del navegador,
# pero el editor habla con la API por rutas que llevan el mismo token: cada autoguardado es un
# `PUT /api/architectures/edit/<token>`, y cada análisis un `POST /api/architectures/<token>/analyze`.
# Tapar solo la página y dejar la API es no tapar nada. `/rules/<token>` va por lo mismo: esa página
# recibe el token de lectura en la ruta.
#
# **El orden importa**, y nginx evalúa estas expresiones en el orden en que están escritas: si la
# regla general de `/api/architectures/` fuese antes que la de `edit`, tomaría la palabra «edit»
# por el token y dejaría el token de verdad en el trozo de detrás — que es la peor de las dos
# opciones, porque además parecería que está tapado.
#
# Lo que **no** se toca, porque no es secreto y sirve para operar: `/c/<slug>`, `/api/challenges/…`
# y `/api/architectures` a secas (el POST que crea, que no lleva token en la ruta).
map $request_uri $uri_sin_token {
    default                                           $request_uri;
    "~^/(a|e)/[A-Za-z0-9_-]+(.*)$"                    "/$1/<token>$2";
    "~^/rules/[A-Za-z0-9_-]+(.*)$"                    "/rules/<token>$1";
    "~^/api/architectures/edit/[A-Za-z0-9_-]+(.*)$"   "/api/architectures/edit/<token>$1";
    "~^/api/architectures/[A-Za-z0-9_-]+(.*)$"        "/api/architectures/<token>$1";
}

# Un enlace de edición es una llave. Basta con que alguien pegue el suyo en un foro para que un
# rastreador lo siga, lo indexe y lo deje al alcance de cualquiera que busque la frase adecuada.
# `robots.txt` pide que no se rastree; esto lo dice en la respuesta misma, que es lo que los
# rastreadores serios obedecen aunque hayan llegado por un enlace y no por el índice.
#
# Va sobre `$request_uri` —la dirección tal como la pidió el navegador— y no sobre `$uri`, porque
# `try_files` reescribe esto a `/index.html` antes de que nadie mire: con `$uri` la cabecera se
# pondría en las páginas equivocadas y faltaría en las que importan.
map $request_uri $robots {
    default            "";
    "~^/(a|e)/"        "noindex, nofollow, noarchive";
}

log_format sin_tokens '$remote_addr [$time_local] "$request_method $uri_sin_token" '
                      '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    access_log /var/log/nginx/access.log sin_tokens;

    # Ni la versión ni el nombre del servidor son asunto del cliente. `off` deja `Server: nginx`
    # a secas; borrar la cabecera entera pide un módulo que la imagen oficial no trae.
    server_tokens off;

    include /etc/nginx/security-headers.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # nginx resuelve los nombres del `proxy_pass` **una sola vez, al arrancar** cuando el
        # destino es literal. Redesplegar solo la API le cambia la IP al contenedor y esta nginx
        # se queda apuntando a la vieja: 502 para siempre, hasta que alguien reinicia el frontend
        # sin motivo aparente. Con el destino en una variable, nginx lo resuelve por petición
        # contra el DNS interno de Docker.
        #
        # `ipv6=off` porque el resolver de Docker contesta a las AAAA con cosas que nginx registra
        # como error, y aquí no hay IPv6 que valga dentro de la red del compose.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream api;

        # Con una variable en `proxy_pass`, nginx deja de sustituir el prefijo del `location` — hay
        # que pasar la URI entera a mano. Sale igual que antes porque `/api/` mapea a `/api/`:
        # `$request_uri` ya trae la cadena de consulta, así que NO se le añade `$is_args$args`.
        proxy_pass http://$upstream:8080$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_real;
    }

    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # index.html nunca se cachea, o un despliegue deja al cliente en el bundle viejo.
    location = /index.html {
        add_header Cache-Control "no-store";
        include /etc/nginx/security-headers.conf;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

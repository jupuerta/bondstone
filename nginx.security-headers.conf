# Las cabeceras de seguridad, en un fichero aparte por una razón concreta de nginx: `add_header`
# **no se hereda** en un bloque que declare uno propio. Un `location` que añade `Cache-Control`
# pierde de golpe todas las del servidor, y la forma de que eso no vuelva a pasar es que añadir
# cabeceras sea una línea (`include`) y no cuatro que alguien olvida copiar.
#
# La política está ajustada a lo que esta aplicación hace de verdad: tipografías empaquetadas,
# lienzo y blobs de exportación, cero terceros, cero peticiones fuera del origen.
#
#  - `style-src 'unsafe-inline'` hace falta porque React escribe estilos en línea (y xyflow más).
#  - `script-src` NO lo lleva: el único script en línea es el arranque de tema de `index.html`, y
#    entra por su hash. Si editas ese script, el hash cambia — `npm run check:csp` falla y te da
#    el nuevo. No lo sustituyas por `'unsafe-inline'`: eso abre justo lo que esto cierra.
#  - `img-src ... data: blob:` es la exportación: `canvas.toBlob` + `URL.createObjectURL`.
#  - `frame-ancestors 'none'` sustituye a `X-Frame-Options`, y `form-action 'none'` es gratis
#    porque en toda la aplicación no hay un solo `<form>`.
#
# Sin `Strict-Transport-Security` a propósito: esto se sirve también en `http://localhost:8080`
# durante el desarrollo, y una HSTS ahí deja el navegador negándose a abrir localhost por HTTP
# durante meses. Va en el Caddyfile (fase 4.3), que solo habla HTTPS.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-o/z48zysSRpwpS70iEqdSF3JRRZDguVpMpDOYZWvSec='; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# Los tokens viajan en la ruta: que no salgan en el Referer hacia otros sitios.
add_header Referrer-Policy same-origin always;

# Vacío en todo lo demás, y nginx no añade una cabecera cuyo valor sea la cadena vacía. El `map`
# que le da valor está arriba del `nginx.conf`, junto a los otros dos.
add_header X-Robots-Tag $robots always;

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: archforge
      POSTGRES_USER: archforge
      POSTGRES_PASSWORD: archforge
    ports:
      - "5432:5432"
    volumes:
      - archforge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archforge -d archforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/arch-forge-backend.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ArchForge: "Host=postgres;Port=5432;Database=archforge;Username=archforge;Password=${POSTGRES_PASSWORD}"
      Cors__AllowedOrigins__0: "http://localhost:5173"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  archforge-postgres-data:

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="description" content="Aprende arquitectura backend construyendo y rompiendo sistemas." />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var stored = localStorage.getItem("bondstone.editor.ui") || localStorage.getItem("archforge.editor.ui") || "{}";
        var appearance = JSON.parse(stored).appearance;
        if (appearance === "light" || appearance === "dark") document.documentElement.setAttribute("data-appearance", appearance);
      } catch (error) {}
    </script>
    <title>Bondstone</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

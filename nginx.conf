# El frente único de ArchForge: sirve la web y el editor, y proxya la API. El editor antiguo ya no
# está detrás de ninguna ruta (docs/Design/Editor/01_decisiones_de_partida.md, decisión 13.3).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Los tokens viajan en la ruta: que no salgan en el Referer hacia otros sitios.
    add_header Referrer-Policy same-origin always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Referrer-Policy same-origin always;
    }

    # index.html nunca se cachea, o un despliegue deja al cliente en el bundle viejo.
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header Referrer-Policy same-origin always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

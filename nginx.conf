# Un solo origen (docs/Design/Editor/01_decisiones_de_partida.md, decisión 4): esta nginx es el
# frente, y el editor antiguo queda detrás en /manual* y los assets que aquí no existen. /e/ ya
# es de este frontend (rebanada 2).
# `frontend` es la imagen congelada del servicio del mismo nombre; se resuelve en cada petición
# para que este contenedor arranque aunque aquel no esté.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    resolver 127.0.0.11 valid=30s;
    set $legacy http://frontend:80;

    # Los tokens viajan en la ruta: que no salgan en el Referer hacia otros sitios.
    add_header Referrer-Policy same-origin always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/manual {
        proxy_pass $legacy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header Referrer-Policy;
    }

    # Los assets de aquí, y si no existen, los del antiguo: los nombres llevan hash y no chocan.
    location ^~ /assets/ {
        try_files $uri @legacy;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Referrer-Policy same-origin always;
    }

    location @legacy {
        proxy_pass $legacy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header Referrer-Policy;
    }

    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Referrer-Policy same-origin always;
    }

    # index.html nunca se cachea, o un despliegue deja al cliente en el bundle viejo.
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header Referrer-Policy same-origin always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

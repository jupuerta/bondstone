# Copia de la del frontend actual sin los bloques del manual: ese documento lo publica
# `npm run sync:manual` del proyecto viejo en su public/, y aquí todavía no existe.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Rutas de cliente sin fichero detrás (/a/{token} y compañía): todo lo no encontrado
    # cae en el shell de la SPA en vez de dar 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy al mismo origen. Es lo que mantiene al navegador fuera de peticiones
    # cross-origin: la imagen se construye con VITE_API_URL=/api y no hay CORS.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html nunca se cachea, o un despliegue deja al cliente en el bundle viejo.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
